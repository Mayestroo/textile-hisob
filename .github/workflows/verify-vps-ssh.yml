name: Verify Novda VPS SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    name: Check Novda deploy access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the dedicated Novda deploy account
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          : "${VPS_PORT:?Missing GitHub secret VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/novda_vps_key"
          chmod 600 "$HOME/.ssh/novda_vps_key"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/novda_vps_key" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -un)" == deploy ]]
          [[ -d /srv/novda/repository/.git ]]
          docker compose version >/dev/null
          printf 'NOVDA_VPS_SSH_CHECK_PASS user=%s repository=present docker_compose=present\n' "$(id -un)"
          REMOTE
