name: Production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novda_test
          POSTGRES_PASSWORD: novda_test
          POSTGRES_DB: novda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novda_test -d novda_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NOVDA_PG_URL: postgresql://novda_test:novda_test@localhost:5432/novda_test
      NOVDA_DISPOSABLE_PG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install admin-bot test dependency
        run: python -m pip install --requirement admin-bot/requirements.txt
      - run: npm ci
      - name: Lint (when configured)
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo 'No lint script configured; skipping.'
          fi
      - run: npx tsc --noEmit
      - run: npm run test:non-pg
      - run: npm run test:postgres
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          : "${VPS_PORT:?Missing GitHub secret VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/novda_vps_key"
          askpass_file="$RUNNER_TEMP/novda-ssh-askpass.sh"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          cat > "$askpass_file" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          ASKPASS
          chmod 700 "$askpass_file"
          eval "$(ssh-agent -s)" >/dev/null
          cleanup() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -f "$key_file" "$askpass_file"
          }
          trap cleanup EXIT
          export SSH_ASKPASS="$askpass_file"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY="${DISPLAY:-:0}"
          ssh-add "$key_file" </dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash /srv/novda/repository/ops/deploy/deploy.sh'

  verify-vps-access:
    name: Verify VPS access without deployment
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH read-only probe
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          : "${VPS_PORT:?Missing GitHub secret VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/novda_vps_key"
          askpass_file="$RUNNER_TEMP/novda-ssh-askpass.sh"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          cat > "$askpass_file" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          ASKPASS
          chmod 700 "$askpass_file"
          eval "$(ssh-agent -s)" >/dev/null
          cleanup() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -f "$key_file" "$askpass_file"
          }
          trap cleanup EXIT
          export SSH_ASKPASS="$askpass_file"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY="${DISPLAY:-:0}"
          ssh-add "$key_file" </dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'set -e; test "$(id -un)" = deploy; docker compose version >/dev/null; printf "NOVDA_VPS_SSH_CHECK_PASS\n"'
