name: Production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novda_test
          POSTGRES_PASSWORD: novda_test
          POSTGRES_DB: novda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novda_test -d novda_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NOVDA_PG_URL: postgresql://novda_test:novda_test@localhost:5432/novda_test
      NOVDA_DISPOSABLE_PG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install admin-bot test dependency
        run: python -m pip install --requirement admin-bot/requirements.txt
      - name: Test worker bot PIN policy
        run: python worker-bot/test_worker_pinless.py
      - run: npm ci
      - name: Lint (when configured)
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo 'No lint script configured; skipping.'
          fi
      - run: npx tsc --noEmit
      - run: npm run test:non-pg
      - run: npm run test:postgres
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          : "${VPS_PORT:?Missing GitHub secret VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/novda_vps_key"
          askpass_file="$RUNNER_TEMP/novda-ssh-askpass.sh"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          cat > "$askpass_file" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          ASKPASS
          chmod 700 "$askpass_file"
          eval "$(ssh-agent -s)" >/dev/null
          cleanup() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -f "$key_file" "$askpass_file"
          }
          trap cleanup EXIT
          export SSH_ASKPASS="$askpass_file"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY="${DISPLAY:-:0}"
          ssh-add "$key_file" </dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -un)" == root ]]
          backup_dir=/srv/novda/backups
          [[ -d "$backup_dir" && -w "$backup_dir" ]] || { printf '%s\n' 'NOVDA_BACKUP_DIRECTORY_NOT_WRITABLE' >&2; exit 1; }
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$backup_dir/novda_prod_before_deploy_${timestamp}.dump"
          temporary="$backup_dir/.novda_prod_before_deploy_${timestamp}.$$.tmp"
          trap 'rm -f -- "$temporary"' EXIT
          docker exec novda-postgres pg_dump --format=custom --username=novda_owner --dbname=novda_prod > "$temporary"
          [[ -s "$temporary" ]] || { printf '%s\n' 'NOVDA_PREDEPLOY_BACKUP_EMPTY' >&2; exit 1; }
          docker exec -i novda-postgres pg_restore --exit-on-error --list < "$temporary" >/dev/null
          chmod 0600 "$temporary"
          mv -- "$temporary" "$backup"
          printf 'NOVDA_PREDEPLOY_BACKUP_PASS file=%s bytes=%s sha256=%s\n' \
            "$(basename "$backup")" "$(stat -c '%s' "$backup")" "$(sha256sum "$backup" | cut -d ' ' -f 1)"
          REMOTE
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash /srv/novda/repository/ops/deploy/deploy.sh'

  bootstrap-novda-paths:
    name: Prepare Novda-only VPS directories
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create missing Novda paths only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_PORT:?Missing GitHub secret VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          expected_signer_fingerprint="$(node -e "const c=require('node:crypto');const {NOVDA_LICENSE_ED25519_PUBLIC_KEY}=require('./packages/contracts/keys/licensePublicKey.cjs');process.stdout.write(c.createHash('sha256').update(c.createPublicKey(NOVDA_LICENSE_ED25519_PUBLIC_KEY).export({type:'spki',format:'der'})).digest('hex'))")"
          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/novda_vps_key"
          askpass_file="$RUNNER_TEMP/novda-ssh-askpass.sh"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          cat > "$askpass_file" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          ASKPASS
          chmod 700 "$askpass_file"
          eval "$(ssh-agent -s)" >/dev/null
          cleanup() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -f "$key_file" "$askpass_file"
          }
          trap cleanup EXIT
          export SSH_ASKPASS="$askpass_file"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY="${DISPLAY:-:0}"
          ssh-add "$key_file" </dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "root@$VPS_HOST" "EXPECTED_SIGNER_FINGERPRINT=$expected_signer_fingerprint bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -un)" == root ]]
          id deploy >/dev/null
          ensure_directory() {
            local directory="$1" owner="$2" group="$3" mode="$4"
            [[ ! -L "$directory" ]] || { printf 'NOVDA_PATH_SYMLINK_REFUSED %s\n' "$directory" >&2; exit 1; }
            if [[ ! -e "$directory" ]]; then
              install -d -o "$owner" -g "$group" -m "$mode" "$directory"
              printf 'NOVDA_PATH_CREATED %s\n' "$directory"
            elif [[ -d "$directory" ]]; then
              printf 'NOVDA_PATH_PRESERVED %s\n' "$directory"
            else
              printf 'NOVDA_PATH_NOT_DIRECTORY %s\n' "$directory" >&2
              exit 1
            fi
          }
          ensure_directory /srv/novda deploy deploy 0750
          ensure_directory /srv/novda/repository deploy deploy 0750
          ensure_directory /srv/novda/secrets root deploy 0750
          ensure_directory /srv/novda/backups root root 0700
          ensure_directory /srv/novda/import deploy deploy 0750
          sqlite_source=/srv/novda/import/comp_novda.sqlite
          if [[ -e "$sqlite_source" || -L "$sqlite_source" ]]; then
            [[ -f "$sqlite_source" && ! -L "$sqlite_source" ]] || { printf '%s\n' 'NOVDA_SQLITE_SOURCE_INVALID' >&2; exit 1; }
            chown 1000:1000 "$sqlite_source"
            chmod 0400 "$sqlite_source"
          fi

          bot_secret_dir=/srv/novda/secrets/bots
          signer_file="$bot_secret_dir/novda-license-ed25519-private-key"
          [[ "$EXPECTED_SIGNER_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] || { printf '%s\n' 'NOVDA_EXPECTED_SIGNER_FINGERPRINT_INVALID' >&2; exit 1; }
          if [[ ! -d "$bot_secret_dir" ]]; then install -d -o 997 -g 988 -m 0700 "$bot_secret_dir"; fi
          [[ ! -L "$bot_secret_dir" ]] || { printf '%s\n' 'NOVDA_BOT_SECRET_DIRECTORY_SYMLINK_REFUSED' >&2; exit 1; }
          if [[ ! -e "$signer_file" ]]; then
            umask 077
            signer_temp="$signer_file.$$.tmp"
            openssl genpkey -algorithm ED25519 -out "$signer_temp"
            chown 997:988 "$signer_temp"
            chmod 0600 "$signer_temp"
            mv -- "$signer_temp" "$signer_file"
          fi
          [[ -s "$signer_file" && ! -L "$signer_file" ]] || { printf '%s\n' 'NOVDA_SIGNER_FILE_INVALID' >&2; exit 1; }
          chown 997:988 "$signer_file"
          chmod 0600 "$signer_file"
          signer_fingerprint="$(openssl pkey -in "$signer_file" -pubout -outform DER | openssl dgst -sha256 -r | cut -d ' ' -f 1)"
          [[ "$signer_fingerprint" == "$EXPECTED_SIGNER_FINGERPRINT" ]] || { printf 'NOVDA_SIGNER_FINGERPRINT_MISMATCH expected=%s actual=%s\n' "$EXPECTED_SIGNER_FINGERPRINT" "$signer_fingerprint" >&2; exit 1; }
          printf 'NOVDA_NEW_SIGNER_FINGERPRINT=%s\n' "$signer_fingerprint"
          openssl pkey -in "$signer_file" -pubout

          ssh_dir=/home/deploy/.ssh
          [[ ! -L "$ssh_dir" ]] || { printf '%s\n' 'DEPLOY_SSH_DIRECTORY_SYMLINK_REFUSED' >&2; exit 1; }
          if [[ ! -d "$ssh_dir" ]]; then install -d -o deploy -g deploy -m 0700 "$ssh_dir"; fi
          repo_key=/home/deploy/.ssh/novda-repository-read
          if [[ ! -e "$repo_key" && ! -e "$repo_key.pub" ]]; then
            runuser -u deploy -- ssh-keygen -q -t ed25519 -N '' -C novda-vps-repository-read -f "$repo_key"
          elif [[ ! -s "$repo_key" || ! -s "$repo_key.pub" ]]; then
            printf '%s\n' 'NOVDA_REPOSITORY_READ_KEY_INCOMPLETE' >&2
            exit 1
          fi
          chown deploy:deploy "$repo_key" "$repo_key.pub"
          chmod 0600 "$repo_key"
          chmod 0644 "$repo_key.pub"
          ssh_config="$ssh_dir/config"
          [[ ! -L "$ssh_config" ]] || { printf '%s\n' 'DEPLOY_SSH_CONFIG_SYMLINK_REFUSED' >&2; exit 1; }
          if [[ ! -f "$ssh_config" ]]; then install -o deploy -g deploy -m 0600 /dev/null "$ssh_config"; fi
          if ! grep -Fq 'Host github-novda-read' "$ssh_config"; then
            cat >> "$ssh_config" <<'SSH_CONFIG'
          Host github-novda-read
            HostName github.com
            HostKeyAlias github.com
            User git
            IdentityFile /home/deploy/.ssh/novda-repository-read
            IdentitiesOnly yes
          SSH_CONFIG
          fi
          chown deploy:deploy "$ssh_config"
          chmod 0600 "$ssh_config"
          known_hosts="$ssh_dir/known_hosts"
          [[ ! -L "$known_hosts" ]] || { printf '%s\n' 'DEPLOY_KNOWN_HOSTS_SYMLINK_REFUSED' >&2; exit 1; }
          if [[ ! -f "$known_hosts" ]]; then install -o deploy -g deploy -m 0600 /dev/null "$known_hosts"; fi
          if ! ssh-keygen -F github.com -f "$known_hosts" >/dev/null; then
            ssh-keyscan -H github.com >> "$known_hosts"
          fi
          chown deploy:deploy "$known_hosts"
          chmod 0600 "$known_hosts"

          repo_url='git@github-novda-read:Mayestroo/textile-hisob.git'
          repo_dir=/srv/novda/repository
          if runuser -u deploy -- env HOME=/home/deploy git ls-remote "$repo_url" HEAD; then
            if [[ ! -d "$repo_dir/.git" ]]; then
              if [[ -n "$(ls -A "$repo_dir")" ]]; then
                printf '%s\n' 'NOVDA_REPOSITORY_PATH_NOT_EMPTY' >&2
                exit 1
              fi
              runuser -u deploy -- env HOME=/home/deploy git clone --branch main "$repo_url" "$repo_dir"
            fi
            if [[ ! -e /srv/novda/secrets/compose.env ]]; then
              bash /srv/novda/repository/ops/deploy/create-secrets.sh
            fi
            chown root:deploy /srv/novda/secrets
            chmod 0750 /srv/novda/secrets
            chown root:deploy /srv/novda/secrets/compose.env
            chmod 0640 /srv/novda/secrets/compose.env
            printf 'NOVDA_REPOSITORY_AND_DATABASE_SECRETS_READY\n'
          else
            printf 'NOVDA_REPOSITORY_READ_ACCESS_PENDING %s\n' "$repo_url"
            runuser -u deploy -- env HOME=/home/deploy ssh-keygen -lf "$repo_key"
            runuser -u deploy -- env HOME=/home/deploy ssh -vvT github-novda-read || true
          fi
          printf 'NOVDA_REPOSITORY_READ_KEY '
          cat "$repo_key.pub"
          REMOTE
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "root@$VPS_HOST" 'bash -s' < ops/deploy/prepare-bot-secrets.sh
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
          "root@$VPS_HOST" 'bash -s' <<'STATUS'
          set -Eeuo pipefail
          cloudflare_token=/srv/novda/secrets/bots/cloudflare-tunnel-token
          compose_env=/srv/novda/secrets/compose.env
          if [[ -s "$cloudflare_token" ]]; then
            if ! grep -Fxq 'NOVDA_ENABLE_PUBLIC_TLS=1' "$compose_env"; then
              printf '%s\n' 'NOVDA_ENABLE_PUBLIC_TLS=1' >> "$compose_env"
            fi
            chown root:deploy "$compose_env"
            chmod 0640 "$compose_env"
          fi
          for name in admin-bot-token worker-bot-token admin-telegram-ids cloudflare-tunnel-token novda-license-ed25519-private-key; do
            file="/srv/novda/secrets/bots/$name"
            if [[ -s "$file" ]]; then state=present; else state=empty; fi
            printf 'NOVDA_SECRET_STATUS %s %s\n' "$name" "$state"
          done
          if [[ -s /srv/novda/import/comp_novda.sqlite ]]; then
            sha256sum /srv/novda/import/comp_novda.sqlite
          else
            printf 'NOVDA_SQLITE_SOURCE missing\n'
          fi
          if grep -Fxq 'NOVDA_ENABLE_PUBLIC_TLS=1' /srv/novda/secrets/compose.env; then
            printf 'NOVDA_PUBLIC_TLS enabled\n'
          else
            printf 'NOVDA_PUBLIC_TLS disabled\n'
          fi
          STATUS

  verify-vps-access:
    name: Verify VPS access without deployment
    needs: [verify, bootstrap-novda-paths]
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH read-only probe
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing GitHub secret VPS_HOST}"
          : "${VPS_USER:?Missing GitHub secret VPS_USER}"
          : "${VPS_PORT:?Missing GitHub secret VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing GitHub secret VPS_SSH_KEY}"
          : "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/novda_vps_key"
          askpass_file="$RUNNER_TEMP/novda-ssh-askpass.sh"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          cat > "$askpass_file" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "${VPS_SSH_PASSPHRASE:?Missing GitHub secret VPS_SSH_PASSPHRASE}"
          ASKPASS
          chmod 700 "$askpass_file"
          eval "$(ssh-agent -s)" >/dev/null
          cleanup() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -f "$key_file" "$askpass_file"
          }
          trap cleanup EXIT
          export SSH_ASKPASS="$askpass_file"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY="${DISPLAY:-:0}"
          ssh-add "$key_file" </dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = deploy
          docker compose version >/dev/null
          for path in /srv/novda/repository/.git /srv/novda/secrets/compose.env /srv/novda/backups /srv/novda/import/comp_novda.sqlite; do
            if test -e "$path"; then state=present; else state=missing; fi
            printf 'NOVDA_PATH %s %s\n' "$path" "$state"
          done
          for service in novda-postgres novda-api novda-admin-bot novda-worker-bot; do
            if docker inspect "$service" >/dev/null 2>&1; then
              state="$(docker inspect --format '{{.State.Status}}' "$service")"
            else
              state=absent
            fi
            printf 'NOVDA_CONTAINER %s %s\n' "$service" "$state"
          done
          printf 'NOVDA_VPS_SSH_CHECK_PASS user=%s docker_compose=present\n' "$(id -un)"
          REMOTE
