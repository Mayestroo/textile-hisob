services:
  novda-postgres:
    image: postgres:16
    container_name: ${NOVDA_POSTGRES_CONTAINER_NAME:-novda-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: novda_prod
      POSTGRES_USER: novda_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      NOVDA_MIGRATOR_PASSWORD: ${NOVDA_MIGRATOR_PASSWORD:?NOVDA_MIGRATOR_PASSWORD is required}
      NOVDA_APP_PASSWORD: ${NOVDA_APP_PASSWORD:?NOVDA_APP_PASSWORD is required}
    volumes:
      - novda-prod_postgres-data:/var/lib/postgresql/data
      - ./postgres-init/01-create-runtime-roles.sh:/docker-entrypoint-initdb.d/01-create-runtime-roles.sh:ro
    networks:
      - novda-prod_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  novda-migrations:
    profiles:
      - migrate
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile
    image: ${NOVDA_API_IMAGE:-novda-api:production}
    restart: "no"
    environment:
      NODE_ENV: production
      NOVDA_OWNER_DATABASE_URL: postgresql://novda_owner:${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}@novda-postgres:5432/novda_prod
      NOVDA_MIGRATOR_DATABASE_URL: postgresql://novda_migrator:${NOVDA_MIGRATOR_PASSWORD:?NOVDA_MIGRATOR_PASSWORD is required}@novda-postgres:5432/novda_prod
      DATABASE_URL: postgresql://novda_app:${NOVDA_APP_PASSWORD:?NOVDA_APP_PASSWORD is required}@novda-postgres:5432/novda_prod
    depends_on:
      novda-postgres:
        condition: service_healthy
    networks:
      - novda-prod_database
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["node", "ops/deploy/migrateProduction.cjs"]

  novda-import:
    profiles:
      - import
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile
    image: ${NOVDA_API_IMAGE:-novda-api:production}
    restart: "no"
    user: "node"
    environment:
      NODE_ENV: production
      NOVDA_IMPORT_DATABASE_URL: postgresql://novda_migrator:${NOVDA_MIGRATOR_PASSWORD:?NOVDA_MIGRATOR_PASSWORD is required}@novda-postgres:5432/novda_prod
    volumes:
      - type: bind
        source: /srv/novda/import/comp_novda.sqlite
        target: /tmp/comp_novda.sqlite
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      novda-postgres:
        condition: service_healthy
    networks:
      - novda-prod_database
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "ops/deploy/importSqliteBaseline.cjs"]
    command: ["--source", "/tmp/comp_novda.sqlite", "--company-id", "comp_novda"]

  novda-api:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile
    image: ${NOVDA_API_IMAGE:-novda-api:production}
    container_name: ${NOVDA_API_CONTAINER_NAME:-novda-api}
    restart: unless-stopped
    user: "997:988"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3474"
      NOVDA_PUBLIC_API_URL: https://sync.novdatextile.uz
      DATABASE_URL: postgresql://novda_app:${NOVDA_APP_PASSWORD:?NOVDA_APP_PASSWORD is required}@novda-postgres:5432/novda_prod
      MIN_CLIENT_VERSION: 1.0.0
      ALLOW_TEST_TOKENS: "false"
      # Owner-controlled override; PIN checks remain on unless explicitly disabled.
      NOVDA_WORKER_PIN_REQUIRED: "${NOVDA_WORKER_PIN_REQUIRED:-true}"
      NOVDA_BUSINESS_MUTATIONS_ENABLED: "true"
      NOVDA_ADMIN_API_TOKEN_FILE: /run/secrets/admin-api-token
      NOVDA_ADMIN_TELEGRAM_IDS_FILE: /run/secrets/admin-telegram-ids
      NOVDA_ADMIN_WEBAPP_SESSION_SECRET_FILE: /run/secrets/admin-webapp-session-secret
      NOVDA_ADMIN_BOT_INTERNAL_URL: http://novda-admin-bot:8080
      NOVDA_WORKER_API_TOKEN_FILE: /run/secrets/worker-api-token
      WORKER_AUTH_HMAC_SECRET_FILE: /run/secrets/worker-auth-hmac-secret
      LOG_LEVEL: info
    depends_on:
      novda-postgres:
        condition: service_healthy
    networks:
      - novda-prod_database
      - novda-prod_services
      - novda-prod_ingress
    expose:
      - "3474"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3474/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    secrets:
      - admin-api-token
      - admin-telegram-ids
      - admin-webapp-session-secret
      - worker-api-token
      - worker-auth-hmac-secret

  novda-admin-bot:
    build:
      context: ../..
      dockerfile: admin-bot/Dockerfile
    image: ${NOVDA_ADMIN_BOT_IMAGE:-novda-admin-bot:production}
    container_name: novda-admin-bot
    restart: unless-stopped
    user: "997:988"
    environment:
      PORT: "8080"
      NOVDA_ADMIN_API_URL: http://novda-api:3474
      NOVDA_ADMIN_API_TOKEN_FILE: /run/secrets/admin-api-token
      NOVDA_ADMIN_TELEGRAM_IDS_FILE: /run/secrets/admin-telegram-ids
      NOVDA_ADMIN_WEBAPP_SESSION_SECRET_FILE: /run/secrets/admin-webapp-session-secret
      ADMIN_WEBAPP_URL: ${NOVDA_ADMIN_WEBAPP_URL:-https://sync.novdatextile.uz/admin-app}
      ADMIN_BOT_TOKEN_FILE: /run/secrets/admin-bot-token
      NOVDA_LICENSE_ED25519_PRIVATE_KEY_FILE: /run/secrets/novda-license-ed25519-private-key
    depends_on:
      novda-api:
        condition: service_healthy
    networks:
      - novda-prod_services
      - novda-prod_bot_egress
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    secrets:
      - admin-bot-token
      - admin-api-token
      - admin-telegram-ids
      - admin-webapp-session-secret
      - novda-license-ed25519-private-key

  novda-worker-bot:
    build:
      context: ../..
      dockerfile: worker-bot/Dockerfile
    image: ${NOVDA_WORKER_BOT_IMAGE:-novda-worker-bot:production}
    container_name: novda-worker-bot
    restart: unless-stopped
    user: "997:988"
    environment:
      PORT: "8081"
      NOVDA_WORKER_API_URL: http://novda-api:3474
      NOVDA_WORKER_API_TOKEN_FILE: /run/secrets/worker-api-token
      WORKER_BOT_TOKEN_FILE: /run/secrets/worker-bot-token
      WORKER_AUTH_HMAC_SECRET_FILE: /run/secrets/worker-auth-hmac-secret
      WORKER_WEBAPP_URL: ${NOVDA_WORKER_WEBAPP_URL:-https://sync.novdatextile.uz/worker-app}
      DEFAULT_COMPANY_ID: ${NOVDA_WORKER_DEFAULT_COMPANY_ID:-}
    depends_on:
      novda-api:
        condition: service_healthy
    networks:
      - novda-prod_services
      - novda-prod_bot_egress
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    secrets:
      - worker-bot-token
      - worker-api-token
      - worker-auth-hmac-secret

  novda-tunnel:
    profiles:
      - public-tls
    image: ${NOVDA_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.1}
    container_name: novda-tunnel
    restart: unless-stopped
    user: "997:988"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare-tunnel-token"]
    depends_on:
      novda-api:
        condition: service_healthy
    networks:
      - novda-prod_ingress
      - novda-prod_tunnel_egress
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    secrets:
      - cloudflare-tunnel-token

networks:
  novda-prod_database:
    name: ${NOVDA_DOCKER_NETWORK:-novda-prod_database}
    driver: bridge
    internal: true
  novda-prod_services:
    name: ${NOVDA_SERVICES_NETWORK:-novda-prod_services}
    driver: bridge
    internal: true
  novda-prod_ingress:
    name: ${NOVDA_INGRESS_NETWORK:-novda-prod_ingress}
    driver: bridge
    internal: true
  novda-prod_bot_egress:
    name: ${NOVDA_BOT_EGRESS_NETWORK:-novda-prod_bot_egress}
    driver: bridge
  novda-prod_tunnel_egress:
    name: ${NOVDA_TUNNEL_EGRESS_NETWORK:-novda-prod_tunnel_egress}
    driver: bridge

volumes:
  novda-prod_postgres-data:
    name: ${NOVDA_DOCKER_VOLUME:-novda-prod_postgres-data}

secrets:
  admin-bot-token:
    file: /srv/novda/secrets/bots/admin-bot-token
  worker-bot-token:
    file: /srv/novda/secrets/bots/worker-bot-token
  admin-api-token:
    file: /srv/novda/secrets/bots/admin-api-token
  admin-telegram-ids:
    file: /srv/novda/secrets/bots/admin-telegram-ids
  admin-webapp-session-secret:
    file: /srv/novda/secrets/bots/admin-webapp-session-secret
  worker-api-token:
    file: /srv/novda/secrets/bots/worker-api-token
  worker-auth-hmac-secret:
    file: /srv/novda/secrets/bots/worker-auth-hmac-secret
  novda-license-ed25519-private-key:
    file: /srv/novda/secrets/bots/novda-license-ed25519-private-key
  cloudflare-tunnel-token:
    file: /srv/novda/secrets/bots/cloudflare-tunnel-token
